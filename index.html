<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="EPIONARA — AI-powered Psychology Platform. Hiểu bản thân qua AI và khoa học hành vi." />
  <meta name="theme-color" content="#6c3de8" />
  <meta property="og:title" content="EPIONARA — AI Psychology Platform" />
  <meta property="og:description" content="Hiểu bản thân là bước đầu để hiểu thế giới." />
  <meta property="og:type" content="website" />

  <!-- Content Security Policy - Hardened -->
  <!-- Note: 'unsafe-inline' in script-src is removed for production since no inline scripts exist. -->
  <!-- 'unsafe-inline' in style-src is kept for React inline styles and Vite style injection. -->
  <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://storage.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        img-src 'self' data: blob:;
        connect-src 'self' https://generativelanguage.googleapis.com https://*.supabase.co;
        worker-src 'self' blob:;
        media-src 'self' blob: data:;
        font-src 'self' https://fonts.gstatic.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
        upgrade-insecure-requests;
      " />

  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy"
    content="camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), bluetooth=()" />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />

  <title>EPIONARA — AI Psychology Platform</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #07091d;
      color: white;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
    }

    #loading-init {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07091d;
      z-index: 99999;
      font-size: 24px;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.5);
      animation: fadeOut 0.5s ease 1.5s forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        pointer-events: none;
      }
    }
  </style>
</head>

<body>
  <div id="loading-init">✦ EPIONARA ✦</div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
