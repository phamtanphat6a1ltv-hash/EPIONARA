<svg width="32" height="32" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradPrimary" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="logoGradPages" x1="0" y1="44" x2="44" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="logoGradInfinity" x1="0" y1="22" x2="44" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="logoGradStar" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cosmic Aura & Orbit -->
  <circle cx="22" cy="22" r="21" stroke="url(#logoGradPrimary)" stroke-width="1" opacity="0.2" fill="none" />
  <ellipse cx="22" cy="22" rx="20" ry="13" transform="rotate(-15 22 22)" fill="none" stroke="url(#logoGradPrimary)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.35" />
  
  <!-- Heart-Shaped Open Journal Pages -->
  <path d="M 22 35 C 13 32, 5 26, 5 17 C 5 9.5, 11.5 6, 17.5 9 C 20 10.2, 21.5 13, 22 15" fill="url(#logoGradPages)" stroke="url(#logoGradPrimary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22 35 C 31 32, 39 26, 39 17 C 39 9.5, 32.5 6, 26.5 9 C 24 10.2, 22.5 13, 22 15" fill="url(#logoGradPages)" stroke="url(#logoGradPrimary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Journal Spine -->
  <line x1="22" y1="15" x2="22" y2="35" stroke="url(#logoGradPrimary)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Infinity Loop (Lemniscate) wrapping connection -->
  <path d="M 22 23 C 17.5 18.5, 11 18.5, 11 23 C 11 27.5, 17.5 27.5, 22 23 C 26.5 18.5, 33 18.5, 33 23 C 33 27.5, 26.5 27.5, 22 23 Z" 
    fill="none" stroke="url(#logoGradInfinity)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" filter="url(#logoGlow)" />
  
  <!-- Center Glowing Core Star -->
  <g transform="translate(22, 23)">
    <path d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="url(#logoGradStar)" filter="url(#logoGlow)" />
  </g>
</svg>
