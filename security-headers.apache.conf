# ============================================================
# EPIONARA - Apache Security Headers Configuration (.htaccess)
# ============================================================
# Dán vào file .htaccess trong thư mục public/dist
# ============================================================

<IfModule mod_headers.c>
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" (chỉ bật khi có SSL)

    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://storage.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com https://cdn.jsdelivr.net; worker-src 'self' blob:; media-src 'self' blob:; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"

    Header always set Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()"
</IfModule>

# Không cache service worker
<Files "sw.js">
    Header set Cache-Control "no-store, no-cache, must-revalidate"
    Header set Pragma "no-cache"
    Header set Service-Worker-Allowed "/"
</Files>

# Cache assets dài hạn
<FilesMatch "\.(js|css|woff2|png|jpg|jpeg|gif|ico|svg|webp)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>
