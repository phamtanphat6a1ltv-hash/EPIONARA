name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: soulmate_journal/package-lock.json

    - name: Install dependencies
      working-directory: ./soulmate_journal
      run: npm ci

    - name: Run lint
      working-directory: ./soulmate_journal
      run: npm run lint

    - name: Run tests
      working-directory: ./soulmate_journal
      run: npm run test
