# ============================================================
# EPIONARA - Nginx Security Headers Configuration
# ============================================================
# Dán đoạn này vào trong block server {} của nginx.conf
# hoặc trong file site configuration của bạn.
#
# Lưu ý: Các HTTP header MẠNH HƠN meta tag trong HTML.
#        Hãy cấu hình server để gửi các header này.
# ============================================================

# Ngăn clickjacking
add_header X-Frame-Options "DENY" always;

# Ngăn MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Bật XSS filter của browser (legacy nhưng vẫn hữu ích)
add_header X-XSS-Protection "1; mode=block" always;

# Kiểm soát thông tin referrer
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Buộc dùng HTTPS (chỉ bật khi đã có SSL)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content Security Policy (MẠNH NHẤT khi đặt ở server level)
add_header Content-Security-Policy "
  default-src 'self';
  script-src 'self' https://storage.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  img-src 'self' data: blob:;
  connect-src 'self' https://generativelanguage.googleapis.com https://cdn.jsdelivr.net;
  worker-src 'self' blob:;
  media-src 'self' blob:;
  font-src 'self' https://fonts.gstatic.com;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
  frame-ancestors 'none';
" always;

# Permissions Policy
add_header Permissions-Policy "
  camera=(self),
  microphone=(self),
  geolocation=(),
  payment=(),
  usb=(),
  bluetooth=(),
  interest-cohort=()
" always;

# ============================================================
# Cache Control cho assets
# ============================================================

# Cache dài hạn cho assets có hash trong tên file
location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Thêm lại security headers vì Nginx override
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Không cache HTML
location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
}

# Không cache service worker
location = /sw.js {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Service-Worker-Allowed "/";
}
